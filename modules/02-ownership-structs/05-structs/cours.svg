<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 210" width="680" height="210" role="img" aria-label="Une struct regroupe ses champs ; ceux qui possèdent des données pointent vers le tas"><title>Une struct regroupe ses champs ; ceux qui possèdent des données pointent vers le tas</title><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--muted,#6b665e)"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--accent,#c2410c)"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ok,#15803d)"/></marker><marker id="a-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--err,#b91c1c)"/></marker><marker id="a-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--text,#1f1d1a)"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--warn,#a16207)"/></marker></defs><rect x="20" y="30" width="260" height="150" rx="8" style="fill:var(--panel,#ffffff);stroke:var(--line,#d9d3c9);stroke-width:1.5"/><text x="32" y="50" text-anchor="start" style="fill:var(--accent,#c2410c);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:700">task : Task</text><rect x="32" y="62" width="236" height="24" rx="4" style="fill:var(--code,#f4f1ec);stroke:var(--code,#f4f1ec);stroke-width:1.5"/><text x="40" y="78" text-anchor="start" style="fill:var(--text,#1f1d1a);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:400">id: u64</text><text x="260" y="78" text-anchor="end" style="fill:var(--muted,#6b665e);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:400">1</text><rect x="32" y="90" width="236" height="24" rx="4" style="fill:var(--code,#f4f1ec);stroke:var(--code,#f4f1ec);stroke-width:1.5"/><text x="40" y="106" text-anchor="start" style="fill:var(--text,#1f1d1a);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:400">title: String</text><text x="260" y="106" text-anchor="end" style="fill:var(--muted,#6b665e);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:400">ptr ● len 13</text><rect x="32" y="118" width="236" height="24" rx="4" style="fill:var(--code,#f4f1ec);stroke:var(--code,#f4f1ec);stroke-width:1.5"/><text x="40" y="134" text-anchor="start" style="fill:var(--text,#1f1d1a);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:400">done: bool</text><text x="260" y="134" text-anchor="end" style="fill:var(--muted,#6b665e);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:400">false</text><rect x="32" y="146" width="236" height="24" rx="4" style="fill:var(--code,#f4f1ec);stroke:var(--code,#f4f1ec);stroke-width:1.5"/><text x="40" y="162" text-anchor="start" style="fill:var(--text,#1f1d1a);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:400">estimate_minutes: u32</text><text x="260" y="162" text-anchor="end" style="fill:var(--muted,#6b665e);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:400">0</text><rect x="360" y="84" width="180" height="34" rx="8" style="fill:var(--ok-soft,#dcfce7);stroke:var(--ok-soft,#dcfce7);stroke-width:1.5"/><text x="450" y="106" text-anchor="middle" style="fill:var(--ok,#15803d);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:600">&quot;Écrire la doc&quot;</text><line x1="270" y1="102" x2="358" y2="101" style="stroke:var(--ok,#15803d);stroke-width:1.8" marker-end="url(#a-ok)"/><text x="360" y="140" text-anchor="start" style="fill:var(--muted,#6b665e);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:12px;font-weight:400;font-style:italic">La struct possède title : quand task</text><text x="360" y="158" text-anchor="start" style="fill:var(--muted,#6b665e);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:12px;font-weight:400;font-style:italic">est détruite, son titre l&#x27;est aussi.</text><text x="360" y="50" text-anchor="start" style="fill:var(--muted,#6b665e);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:12px;font-weight:400">En TS : un objet { id, title, done, … }</text></svg>
