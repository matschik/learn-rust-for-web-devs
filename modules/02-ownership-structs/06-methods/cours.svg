<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230" width="680" height="230" role="img" aria-label="Le premier paramètre d&#x27;une méthode dit ce qu&#x27;elle a le droit de faire"><title>Le premier paramètre d&#x27;une méthode dit ce qu&#x27;elle a le droit de faire</title><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--muted,#6b665e)"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--accent,#c2410c)"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ok,#15803d)"/></marker><marker id="a-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--err,#b91c1c)"/></marker><marker id="a-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--text,#1f1d1a)"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--warn,#a16207)"/></marker></defs><rect x="20" y="20" width="206" height="190" rx="8" style="fill:var(--panel,#ffffff);stroke:var(--line,#d9d3c9);stroke-width:1.5"/><text x="34" y="48" text-anchor="start" style="fill:var(--ok,#15803d);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:18px;font-weight:700">&amp;self</text><text x="34" y="72" text-anchor="start" style="fill:var(--text,#1f1d1a);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:13px;font-weight:400">lire</text><rect x="34" y="84" width="26" height="22" rx="11" style="fill:var(--ok-soft,#dcfce7);stroke:var(--ok-soft,#dcfce7);stroke-width:1.5"/><text x="47.0" y="99.5" text-anchor="middle" style="fill:var(--ok,#15803d);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:12px;font-weight:600">R</text><text x="34" y="140" text-anchor="start" style="fill:var(--text,#1f1d1a);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:400">task.is_done()</text><text x="34" y="168" text-anchor="start" style="fill:var(--muted,#6b665e);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:12px;font-weight:400;font-style:italic">task reste utilisable</text><rect x="242" y="20" width="206" height="190" rx="8" style="fill:var(--panel,#ffffff);stroke:var(--line,#d9d3c9);stroke-width:1.5"/><text x="256" y="48" text-anchor="start" style="fill:var(--accent,#c2410c);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:18px;font-weight:700">&amp;mut self</text><text x="256" y="72" text-anchor="start" style="fill:var(--text,#1f1d1a);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:13px;font-weight:400">lire et modifier</text><rect x="256" y="84" width="26" height="22" rx="11" style="fill:var(--ok-soft,#dcfce7);stroke:var(--ok-soft,#dcfce7);stroke-width:1.5"/><text x="269.0" y="99.5" text-anchor="middle" style="fill:var(--ok,#15803d);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:12px;font-weight:600">R</text><rect x="288" y="84" width="26" height="22" rx="11" style="fill:var(--ok-soft,#dcfce7);stroke:var(--ok-soft,#dcfce7);stroke-width:1.5"/><text x="301.0" y="99.5" text-anchor="middle" style="fill:var(--ok,#15803d);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:12px;font-weight:600">W</text><text x="256" y="140" text-anchor="start" style="fill:var(--text,#1f1d1a);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:400">task.complete()</text><text x="256" y="168" text-anchor="start" style="fill:var(--muted,#6b665e);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:12px;font-weight:400;font-style:italic">task doit être mut</text><rect x="464" y="20" width="206" height="190" rx="8" style="fill:var(--panel,#ffffff);stroke:var(--line,#d9d3c9);stroke-width:1.5"/><text x="478" y="48" text-anchor="start" style="fill:var(--err,#b91c1c);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:18px;font-weight:700">self</text><text x="478" y="72" text-anchor="start" style="fill:var(--text,#1f1d1a);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:13px;font-weight:400">prendre possession</text><rect x="478" y="84" width="26" height="22" rx="11" style="fill:var(--err-soft,#fee2e2);stroke:var(--err-soft,#fee2e2);stroke-width:1.5"/><text x="491.0" y="99.5" text-anchor="middle" style="fill:var(--err,#b91c1c);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:12px;font-weight:600">O</text><text x="478" y="140" text-anchor="start" style="fill:var(--text,#1f1d1a);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:400">task.archive()</text><text x="478" y="168" text-anchor="start" style="fill:var(--muted,#6b665e);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:12px;font-weight:400;font-style:italic">task n&#x27;existe plus après</text></svg>
