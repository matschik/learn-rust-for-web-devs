<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" width="680" height="290" role="img" aria-label="Une référence emprunte sans prendre possession : plusieurs lecteurs ou un seul écrivain"><title>Une référence emprunte sans prendre possession : plusieurs lecteurs ou un seul écrivain</title><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--muted,#6b665e)"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--accent,#c2410c)"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ok,#15803d)"/></marker><marker id="a-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--err,#b91c1c)"/></marker><marker id="a-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--text,#1f1d1a)"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--warn,#a16207)"/></marker></defs><rect x="20" y="30" width="150" height="86" rx="8" style="fill:var(--panel,#ffffff);stroke:var(--line,#d9d3c9);stroke-width:1.5"/><text x="30" y="48" text-anchor="start" style="fill:var(--accent,#c2410c);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:700">title</text><text x="30" y="70" text-anchor="start" style="fill:var(--muted,#6b665e);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:400">ptr</text><text x="80" y="70" text-anchor="start" style="fill:var(--text,#1f1d1a);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:400">●</text><text x="30" y="86" text-anchor="start" style="fill:var(--muted,#6b665e);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:400">len</text><text x="80" y="86" text-anchor="start" style="fill:var(--text,#1f1d1a);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:400">6</text><text x="30" y="102" text-anchor="start" style="fill:var(--muted,#6b665e);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:400">cap</text><text x="80" y="102" text-anchor="start" style="fill:var(--text,#1f1d1a);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:400">6</text><rect x="220" y="50" width="110" height="34" rx="8" style="fill:var(--ok-soft,#dcfce7);stroke:var(--ok-soft,#dcfce7);stroke-width:1.5"/><text x="275" y="72" text-anchor="middle" style="fill:var(--ok,#15803d);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:600">&quot;Deploy&quot;</text><line x1="110" y1="66" x2="218" y2="67" style="stroke:var(--ok,#15803d);stroke-width:1.8" marker-end="url(#a-ok)"/><rect x="20" y="150" width="150" height="40" rx="8" style="fill:var(--accent-soft,#fdebdd);stroke:var(--accent-soft,#fdebdd);stroke-width:1.5"/><text x="30" y="175" text-anchor="start" style="fill:var(--accent,#c2410c);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:700">r = &amp;title</text><path d="M95 150 L 95 118" style="fill:none;stroke:var(--accent,#c2410c);stroke-width:1.8" marker-end="url(#a-accent)"/><text x="20" y="214" text-anchor="start" style="fill:var(--muted,#6b665e);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:12px;font-weight:400;font-style:italic">r pointe vers title, pas vers le tas.</text><text x="20" y="232" text-anchor="start" style="fill:var(--muted,#6b665e);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:12px;font-weight:400;font-style:italic">title reste propriétaire : après l&#x27;emprunt,</text><text x="20" y="250" text-anchor="start" style="fill:var(--muted,#6b665e);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:12px;font-weight:400;font-style:italic">il récupère toutes ses permissions.</text><text x="380" y="30" text-anchor="start" style="fill:var(--text,#1f1d1a);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:13px;font-weight:600">Plusieurs &amp;T en même temps</text><rect x="380" y="44" width="80" height="30" rx="8" style="fill:var(--ok-soft,#dcfce7);stroke:var(--ok-soft,#dcfce7);stroke-width:1.5"/><text x="420" y="64" text-anchor="middle" style="fill:var(--ok,#15803d);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:600">&amp;title</text><rect x="472" y="44" width="80" height="30" rx="8" style="fill:var(--ok-soft,#dcfce7);stroke:var(--ok-soft,#dcfce7);stroke-width:1.5"/><text x="512" y="64" text-anchor="middle" style="fill:var(--ok,#15803d);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:600">&amp;title</text><rect x="564" y="44" width="80" height="30" rx="8" style="fill:var(--ok-soft,#dcfce7);stroke:var(--ok-soft,#dcfce7);stroke-width:1.5"/><text x="604" y="64" text-anchor="middle" style="fill:var(--ok,#15803d);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:600">&amp;title</text><text x="380" y="92" text-anchor="start" style="fill:var(--ok,#15803d);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:12px;font-weight:400">lecture seule pour tous : OK</text><text x="380" y="130" text-anchor="start" style="fill:var(--text,#1f1d1a);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:13px;font-weight:600">Un seul &amp;mut T à la fois</text><rect x="380" y="144" width="100" height="30" rx="8" style="fill:var(--accent-soft,#fdebdd);stroke:var(--accent-soft,#fdebdd);stroke-width:1.5"/><text x="430" y="164" text-anchor="middle" style="fill:var(--accent,#c2410c);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:600">&amp;mut title</text><rect x="492" y="144" width="80" height="30" rx="8" style="fill:var(--err-soft,#fee2e2);stroke:var(--err-soft,#fee2e2);stroke-width:1.5;stroke-dasharray:5 4"/><text x="532" y="164" text-anchor="middle" style="fill:var(--err,#b91c1c);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:600">&amp;title</text><text x="380" y="192" text-anchor="start" style="fill:var(--err,#b91c1c);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:12px;font-weight:400">un lecteur pendant une écriture : E0502</text><rect x="380" y="214" width="280" height="56" rx="8" style="fill:var(--code,#f4f1ec);stroke:var(--code,#f4f1ec);stroke-width:1.5"/><text x="392" y="236" text-anchor="start" style="fill:var(--text,#1f1d1a);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:12px;font-weight:400">En TS, deux bouts de code peuvent</text><text x="392" y="254" text-anchor="start" style="fill:var(--text,#1f1d1a);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:12px;font-weight:400">modifier le même objet sans contrôle.</text></svg>
