e="fill:var(--ok,#15803d);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:12px;font-weight:600">Correction : lire first.len() avant le push. L&#x27;emprunt meurt, titles retrouve W.</text></svg>
