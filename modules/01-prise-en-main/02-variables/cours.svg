<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="680" height="250" role="img" aria-label="let mut modifie la même variable, le shadowing en crée une nouvelle"><title>let mut modifie la même variable, le shadowing en crée une nouvelle</title><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--muted,#6b665e)"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--accent,#c2410c)"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ok,#15803d)"/></marker><marker id="a-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--err,#b91c1c)"/></marker><marker id="a-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--text,#1f1d1a)"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--warn,#a16207)"/></marker></defs><text x="20" y="28" text-anchor="start" style="fill:var(--text,#1f1d1a);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:14px;font-weight:600">let mut : une seule variable, sa valeur change</text><text x="20" y="58" text-anchor="start" style="fill:var(--text,#1f1d1a);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:400">let mut count = 0;</text><text x="20" y="80" text-anchor="start" style="fill:var(--text,#1f1d1a);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:400">count += 1;</text><rect x="200" y="44" width="110" height="44" rx="8" style="fill:var(--panel,#ffffff);stroke:var(--line,#d9d3c9);stroke-width:1.5"/><text x="210" y="62" text-anchor="start" style="fill:var(--muted,#6b665e);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:400">count : u32</text><text x="240" y="81" text-anchor="start" style="fill:var(--muted,#6b665e);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;font-weight:400">0</text><line x1="256" y1="76" x2="276" y2="76" style="stroke:var(--accent,#c2410c);stroke-width:1.8" marker-end="url(#a-accent)"/><text x="282" y="81" text-anchor="start" style="fill:var(--accent,#c2410c);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;font-weight:700">1</text><text x="20" y="112" text-anchor="start" style="fill:var(--muted,#6b665e);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:12px;font-weight:400;font-style:italic">Même case, même type. Sans mut : E0384.</text><text x="360" y="28" text-anchor="start" style="fill:var(--text,#1f1d1a);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:14px;font-weight:600">shadowing : une nouvelle variable, même nom</text><text x="360" y="58" text-anchor="start" style="fill:var(--text,#1f1d1a);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:400">let title = &quot;  Doc &quot;.trim();</text><text x="360" y="80" text-anchor="start" style="fill:var(--text,#1f1d1a);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:400">let title = title.len();</text><rect x="360" y="100" width="130" height="44" rx="8" style="fill:var(--code,#f4f1ec);stroke:var(--line,#d9d3c9);stroke-width:1.5;stroke-dasharray:5 4"/><text x="372" y="118" text-anchor="start" style="fill:var(--muted,#6b665e);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:400">title : &amp;str</text><text x="372" y="136" text-anchor="start" style="fill:var(--muted,#6b665e);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;font-weight:400">&quot;Doc&quot;</text><line x1="490" y1="122" x2="520" y2="122" style="stroke:var(--accent,#c2410c);stroke-width:1.8" marker-end="url(#a-accent)"/><rect x="524" y="100" width="136" height="44" rx="8" style="fill:var(--panel,#ffffff);stroke:var(--accent,#c2410c);stroke-width:1.5"/><text x="536" y="118" text-anchor="start" style="fill:var(--accent,#c2410c);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:400">title : usize</text><text x="536" y="136" text-anchor="start" style="fill:var(--accent,#c2410c);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;font-weight:700">3</text><text x="360" y="166" text-anchor="start" style="fill:var(--muted,#6b665e);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:12px;font-weight:400;font-style:italic">L&#x27;ancienne est masquée, et le type peut changer.</text><rect x="20" y="196" width="640" height="40" rx="8" style="fill:var(--code,#f4f1ec);stroke:var(--code,#f4f1ec);stroke-width:1.5"/><text x="36" y="221" text-anchor="start" style="fill:var(--text,#1f1d1a);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:13px;font-weight:400">En TS : let ≈ let mut, const ≈ let. Le shadowing n&#x27;existe pas (redéclarer = erreur).</text></svg>
