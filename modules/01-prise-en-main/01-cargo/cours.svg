<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="680" height="250" role="img" aria-label="Le cycle cargo : un seul outil pour build, test et run"><title>Le cycle cargo : un seul outil pour build, test et run</title><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--muted,#6b665e)"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--accent,#c2410c)"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ok,#15803d)"/></marker><marker id="a-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--err,#b91c1c)"/></marker><marker id="a-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--text,#1f1d1a)"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--warn,#a16207)"/></marker></defs><rect x="20" y="40" width="170" height="110" rx="8" style="fill:var(--panel,#ffffff);stroke:var(--line,#d9d3c9);stroke-width:1.5"/><text x="105" y="30" text-anchor="middle" style="fill:var(--muted,#6b665e);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:12px;font-weight:400">ton crate</text><text x="40" y="72" text-anchor="start" style="fill:var(--text,#1f1d1a);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;font-weight:600">Cargo.toml</text><text x="40" y="92" text-anchor="start" style="fill:var(--muted,#6b665e);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:12px;font-weight:400">≈ package.json</text><text x="40" y="124" text-anchor="start" style="fill:var(--text,#1f1d1a);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;font-weight:600">src/lib.rs</text><text x="40" y="142" text-anchor="start" style="fill:var(--muted,#6b665e);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:12px;font-weight:400">code + #[test]</text><path d="M190 95 C 230 95, 230 55, 262 55" style="fill:none;stroke:var(--accent,#c2410c);stroke-width:1.8" marker-end="url(#a-accent)"/><rect x="265" y="30" width="150" height="50" rx="8" style="fill:var(--accent-soft,#fdebdd);stroke:var(--accent-soft,#fdebdd);stroke-width:1.5"/><text x="340" y="53" text-anchor="middle" style="fill:var(--accent,#c2410c);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;font-weight:600">cargo build</text><text x="340" y="71" text-anchor="middle" style="fill:var(--muted,#6b665e);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:12px;font-weight:400">≈ tsc</text><line x1="415" y1="55" x2="445" y2="55" style="stroke:var(--muted,#6b665e);stroke-width:1.8" marker-end="url(#a-muted)"/><text x="452" y="60" text-anchor="start" style="fill:var(--text,#1f1d1a);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:13px;font-weight:400">compile → target/debug/</text><path d="M190 95 C 230 95, 230 125, 262 125" style="fill:none;stroke:var(--accent,#c2410c);stroke-width:1.8" marker-end="url(#a-accent)"/><rect x="265" y="100" width="150" height="50" rx="8" style="fill:var(--accent-soft,#fdebdd);stroke:var(--accent-soft,#fdebdd);stroke-width:1.5"/><text x="340" y="123" text-anchor="middle" style="fill:var(--accent,#c2410c);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;font-weight:600">cargo test</text><text x="340" y="141" text-anchor="middle" style="fill:var(--muted,#6b665e);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:12px;font-weight:400">≈ npm test</text><line x1="415" y1="125" x2="445" y2="125" style="stroke:var(--muted,#6b665e);stroke-width:1.8" marker-end="url(#a-muted)"/><text x="452" y="130" text-anchor="start" style="fill:var(--text,#1f1d1a);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:13px;font-weight:400">compile + lance les #[test]</text><path d="M190 95 C 230 95, 230 195, 262 195" style="fill:none;stroke:var(--accent,#c2410c);stroke-width:1.8" marker-end="url(#a-accent)"/><rect x="265" y="170" width="150" height="50" rx="8" style="fill:var(--accent-soft,#fdebdd);stroke:var(--accent-soft,#fdebdd);stroke-width:1.5"/><text x="340" y="193" text-anchor="middle" style="fill:var(--accent,#c2410c);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;font-weight:600">cargo run</text><text x="340" y="211" text-anchor="middle" style="fill:var(--muted,#6b665e);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:12px;font-weight:400">≈ node index.js</text><line x1="415" y1="195" x2="445" y2="195" style="stroke:var(--muted,#6b665e);stroke-width:1.8" marker-end="url(#a-muted)"/><text x="452" y="200" text-anchor="start" style="fill:var(--text,#1f1d1a);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:13px;font-weight:400">compile + exécute le binaire</text><text x="20" y="235" text-anchor="start" style="fill:var(--muted,#6b665e);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:13px;font-weight:400;font-style:italic">cargo compile d&#x27;abord : une erreur de type bloque tout, avant même le premier test.</text></svg>
