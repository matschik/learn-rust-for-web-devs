<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" width="680" height="270" role="img" aria-label="Chaque entier Rust a une taille et des bornes fixes"><title>Chaque entier Rust a une taille et des bornes fixes</title><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--muted,#6b665e)"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--accent,#c2410c)"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ok,#15803d)"/></marker><marker id="a-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--err,#b91c1c)"/></marker><marker id="a-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--text,#1f1d1a)"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--warn,#a16207)"/></marker></defs><text x="20" y="26" text-anchor="start" style="fill:var(--text,#1f1d1a);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:14px;font-weight:600">TS : number (un f64) pour tout.  Rust : tu choisis la taille et le signe.</text><text x="20" y="66" text-anchor="start" style="fill:var(--accent,#c2410c);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;font-weight:700">u8</text><rect x="380.0" y="52" width="260.0" height="20" rx="4" style="fill:var(--accent-soft,#fdebdd);stroke:var(--accent-soft,#fdebdd);stroke-width:1.5"/><text x="386.0" y="66" text-anchor="start" style="fill:var(--muted,#6b665e);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:400">0</text><text x="634" y="66" text-anchor="end" style="fill:var(--muted,#6b665e);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:400">255</text><text x="20" y="102" text-anchor="start" style="fill:var(--accent,#c2410c);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;font-weight:700">i8</text><rect x="120.0" y="88" width="520.0" height="20" rx="4" style="fill:var(--accent-soft,#fdebdd);stroke:var(--accent-soft,#fdebdd);stroke-width:1.5"/><text x="126.0" y="102" text-anchor="start" style="fill:var(--muted,#6b665e);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:400">-128</text><text x="634" y="102" text-anchor="end" style="fill:var(--muted,#6b665e);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:400">127</text><text x="20" y="138" text-anchor="start" style="fill:var(--ok,#15803d);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;font-weight:700">u32</text><rect x="380.0" y="124" width="260.0" height="20" rx="4" style="fill:var(--ok-soft,#dcfce7);stroke:var(--ok-soft,#dcfce7);stroke-width:1.5"/><text x="386.0" y="138" text-anchor="start" style="fill:var(--muted,#6b665e);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:400">0</text><text x="634" y="138" text-anchor="end" style="fill:var(--muted,#6b665e);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:400">4 294 967 295</text><text x="20" y="174" text-anchor="start" style="fill:var(--ok,#15803d);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;font-weight:700">i32</text><rect x="120.0" y="160" width="520.0" height="20" rx="4" style="fill:var(--ok-soft,#dcfce7);stroke:var(--ok-soft,#dcfce7);stroke-width:1.5"/><text x="126.0" y="174" text-anchor="start" style="fill:var(--muted,#6b665e);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:400">-2 147 483 648</text><text x="634" y="174" text-anchor="end" style="fill:var(--muted,#6b665e);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:400">2 147 483 647</text><text x="20" y="210" text-anchor="start" style="fill:var(--warn,#a16207);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;font-weight:700">usize</text><rect x="380.0" y="196" width="260.0" height="20" rx="4" style="fill:var(--warn-soft,#fef3c7);stroke:var(--warn-soft,#fef3c7);stroke-width:1.5"/><text x="386.0" y="210" text-anchor="start" style="fill:var(--muted,#6b665e);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:400">0</text><text x="634" y="210" text-anchor="end" style="fill:var(--muted,#6b665e);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:400">taille mémoire (64 bits)</text><line x1="380.0" y1="44" x2="380.0" y2="230" style="stroke:var(--line,#d9d3c9);stroke-width:1.8;stroke-dasharray:5 4"/><text x="380.0" y="244" text-anchor="middle" style="fill:var(--muted,#6b665e);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:400">0</text><text x="20" y="262" text-anchor="start" style="fill:var(--muted,#6b665e);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:12px;font-weight:400;font-style:italic">u32 : 300 - 305 ne vaut pas -5. En debug, ça panique (overflow). Les index et longueurs sont des usize.</text></svg>
