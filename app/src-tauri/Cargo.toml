[package]
name = "learn-rust-app"
version = "0.1.0"
description = "Learn Rust : la leçon, l'éditeur et le terminal dans une fenêtre"
authors = ["Mathieu Schimmerling"]
license = "MIT"
edition = "2024"

# L'app a son propre workspace cargo, à part de celui des exercices du repo.
[workspace]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "learn_rust_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
portable-pty = "0.9"
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
tauri-plugin-dialog = "2"
notify-debouncer-mini = "0.7"
trash = "5"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
unwrap_used = "warn"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
