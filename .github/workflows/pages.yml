# Le site est hébergé sur Cloudflare Pages (learn-rust-for-web-devs.matschik.com), déployé
# par cloudflare.yml à chaque push sur main. GitHub Pages ne sert plus qu'une redirection,
# pour que les anciens liens matschik.github.io/learn-rust-for-web-devs/… continuent de marcher.
name: Pages (redirection)

on:
  push:
    branches: [main]
    paths: [site/redirect.html, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir _redirect
          cp site/redirect.html _redirect/index.html
          cp site/redirect.html _redirect/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _redirect
      - id: deployment
        uses: actions/deploy-pages@v4
