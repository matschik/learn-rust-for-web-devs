<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn Rust for web devs</title>
<meta name="description" content="Le dashboard du parcours : le cours, les étapes à cocher et l'état des tests de chaque exercice.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c2410c'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='ui-monospace,Menlo,monospace' font-size='36' font-weight='700' fill='%23fff7ed'%3Ers%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500;600&family=Geist+Mono&display=swap" rel="stylesheet">
<style>
  /* Hallmark · shape: app screen · genre: atmospheric · theme: Lumen (deal 1/3, seed free-french-course-teaching-e686·57df0a55·2026-10-28·r0) · redesign: restyle
   * signature: the step checklist beside the cargo test status · axes: dark/roman-serif/warm · posture: restrained · contrast: pass · v2.0.0 */
  /* Hallmark · pre-emit critique: P4 H4 E4 S4 R5 V3 · weakest: V, the layout is kept on purpose; the theme only lends palette, faces and surfaces */
  /* Hallmark · waive 49b · lien du README de module · le dashboard affiche les fiches du parcours telles quelles, titres de chapitre compris */
  :root {
    color-scheme: dark;
    --space-3xs: 2px; --space-2xs: 4px; --space-xs: 8px; --space-sm: 12px; --space-md: 16px; --space-lg: 24px; --space-xl: 40px; --space-2xl: 64px; --space-3xl: 96px;
    --text-xs: 0.8125rem; --text-sm: 0.875rem; --text-md: 1rem; --text-lg: 1.125rem; --text-xl: 1.375rem; --text-2xl: 2.75rem;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1); --dur-micro: 120ms; --dur-short: 220ms; --dur-long: 420ms;
    --color-paper: oklch(12.5% 0.027 290); --color-paper-2: oklch(16% 0.03 290); --color-paper-3: oklch(20% 0.032 290);
    --color-ink: oklch(96% 0.01 300); --color-ink-2: oklch(85% 0.017 298); --color-muted: oklch(69% 0.026 295);
    --color-rule: oklch(27% 0.034 290); --color-rule-2: oklch(36% 0.04 292);
    --color-accent: oklch(80% 0.15 62); --color-accent-ink: oklch(14% 0.028 290); --color-accent-soft: oklch(24% 0.05 62);
    --color-focus: oklch(80% 0.15 62);
    --color-ok: oklch(80% 0.13 155); --color-ok-soft: oklch(22% 0.04 155);
    --color-warn: oklch(85% 0.13 90); --color-warn-soft: oklch(23% 0.04 90);
    --color-err: oklch(74% 0.14 22); --color-err-soft: oklch(22% 0.05 22);
    --font-display: "Instrument Serif", ui-serif, Georgia, serif; --font-body: "Geist", ui-sans-serif, system-ui, sans-serif;
    --font-mono: "Geist Mono", ui-monospace, monospace;
    --radius-card: 10px; --radius-control: 8px; --radius-pill: 999px; --rule-hair: 1px;
    /* Les diagrammes cours.svg lisent ces noms-là : ils suivent ainsi le thème clair ou sombre. */
    --panel: var(--color-paper-2); --text: var(--color-ink); --muted: var(--color-muted); --line: var(--color-rule-2); --code: var(--color-paper-3);
    --accent: var(--color-accent); --accent-soft: var(--color-accent-soft); --ok: var(--color-ok); --ok-soft: var(--color-ok-soft);
    --warn: var(--color-warn); --warn-soft: var(--color-warn-soft); --err: var(--color-err); --err-soft: var(--color-err-soft);
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --color-paper: oklch(97% 0.008 290); --color-paper-2: oklch(94.5% 0.011 290); --color-paper-3: oklch(91.5% 0.013 290);
      --color-ink: oklch(18% 0.02 290); --color-ink-2: oklch(30% 0.022 292); --color-muted: oklch(47% 0.026 292);
      --color-rule: oklch(88% 0.014 290); --color-rule-2: oklch(79% 0.02 292);
      --color-accent: oklch(52% 0.15 52); --color-accent-ink: oklch(98% 0.01 62); --color-accent-soft: oklch(93% 0.04 62);
      --color-focus: oklch(52% 0.15 52);
      --color-ok: oklch(45% 0.12 155); --color-ok-soft: oklch(94% 0.04 155);
      --color-warn: oklch(48% 0.11 80); --color-warn-soft: oklch(94% 0.05 90);
      --color-err: oklch(50% 0.17 25); --color-err-soft: oklch(94% 0.03 22);
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { overflow-x: clip; }
  html { scrollbar-color: var(--color-muted) var(--color-paper); }
  body { caret-color: var(--color-accent); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  .table { overflow-x: auto; }
  body { margin: 0; background: var(--color-paper); color: var(--color-ink); font: 400 var(--text-md)/1.6 var(--font-body); -webkit-font-smoothing: antialiased; }
  :focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
  ::selection { background: color-mix(in oklab, var(--color-accent) 25%, transparent); }
  a { color: var(--color-accent); text-decoration-thickness: 1px; text-underline-offset: 0.16em; }
  code, pre { font-family: var(--font-mono); }
  .i { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.14em; }
  .muted { color: var(--color-muted); font-size: var(--text-xs); }
  .wrap { max-width: 800px; margin: 0 auto; padding: var(--space-lg) var(--space-md) var(--space-3xl); }
  .loading { padding: var(--space-3xl) 0; text-align: center; color: var(--color-muted); }

  /* La barre du haut et la progression */
  .top { display: flex; align-items: center; gap: var(--space-sm); font-size: var(--text-sm); color: var(--color-muted); min-height: 40px; }
  .brand { display: flex; align-items: center; gap: var(--space-xs); color: var(--color-ink); text-decoration: none; font: 400 var(--text-xl)/1 var(--font-display); text-transform: lowercase; letter-spacing: -0.01em; }
  .top .spacer { flex: 1; }
  .top a.link { color: var(--color-muted); text-decoration: none; padding: var(--space-xs) 0; }
  .top a.link:hover { color: var(--color-ink); }
  .top a.link:active { color: var(--color-accent); }
  .bar { height: 2px; background: var(--color-rule); overflow: hidden; margin: var(--space-sm) 0 var(--space-xl); }
  .bar > div { height: 100%; background: var(--color-accent); transform-origin: left; transition: transform var(--dur-long) var(--ease-out); }

  /* L'exercice en cours */
  .crumbs { font-size: var(--text-sm); color: var(--color-muted); display: flex; align-items: baseline; gap: var(--space-xs); flex-wrap: wrap; }
  .crumbs a { color: var(--color-muted); }
  .crumbs a:hover { color: var(--color-ink); }
  .focus h1 { font: 400 var(--text-2xl)/1 var(--font-display); text-transform: lowercase; letter-spacing: -0.015em; margin: var(--space-xs) 0 var(--space-lg); text-wrap: balance; overflow-wrap: break-word; min-width: 0; }
  .tabs { display: inline-flex; gap: var(--space-2xs); padding: var(--space-2xs); border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-pill); margin-bottom: var(--space-xl); }
  .tabs button { border: 0; background: none; color: var(--color-muted); font: 500 var(--text-sm) var(--font-body); min-height: 36px; padding: 0 var(--space-md); border-radius: var(--radius-pill); cursor: pointer; display: inline-flex; align-items: center; gap: var(--space-xs); transition: background-color var(--dur-short) var(--ease-out), color var(--dur-short) var(--ease-out); }
  .tabs button:hover { color: var(--color-ink); background: var(--color-paper-2); }
  .tabs button:active { background: var(--color-paper-3); }
  .tabs button.on { background: var(--color-paper-3); color: var(--color-ink); }
  .tabs button .n { font-variant-numeric: tabular-nums; color: var(--color-muted); }
  .tabs button.on .n { color: var(--color-accent); }
  .tabs button .c { font: 400 var(--text-xs) var(--font-mono); color: var(--color-muted); }
  .doc h2 { font-size: var(--text-xl); font-weight: 600; line-height: 1.3; margin: var(--space-xl) 0 var(--space-sm); display: flex; align-items: center; gap: var(--space-sm); text-wrap: balance; }
  .doc p, .doc li { max-width: 68ch; text-wrap: pretty; }
  .doc pre { background: var(--color-paper-2); border: var(--rule-hair) solid var(--color-rule); padding: var(--space-md); border-radius: var(--radius-card); overflow-x: auto; font-size: var(--text-sm); line-height: 1.55; }
  .doc code { background: var(--color-paper-3); padding: 0 var(--space-2xs); border-radius: var(--space-2xs); font-size: 0.875em; }
  .doc pre code { background: none; padding: 0; }
  .doc table { border-collapse: collapse; width: 100%; font-size: var(--text-sm); margin: var(--space-lg) 0; }
  .doc th, .doc td { border-bottom: var(--rule-hair) solid var(--color-rule); padding: var(--space-xs) var(--space-sm); text-align: left; vertical-align: top; }
  .doc th { color: var(--color-muted); font-weight: 500; white-space: nowrap; }
  .figure { background: var(--color-paper-2); border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-card); padding: var(--space-md); margin: var(--space-lg) 0; }
  .figure svg { width: 100%; height: auto; display: block; }

  /* Les lectures du Rust Book */
  .reads { display: grid; gap: var(--space-xs); }
  .read { display: flex; align-items: center; gap: var(--space-sm); padding: var(--space-sm) var(--space-md); border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-card); color: var(--color-ink); text-decoration: none; transition: border-color var(--dur-short) var(--ease-out); }
  .read:hover { border-color: var(--color-rule-2); }
  .read:active { background: var(--color-paper-2); }
  .read .kind { flex: none; width: 32px; height: 32px; border-radius: var(--radius-control); display: grid; place-items: center; background: var(--color-accent-soft); color: var(--color-accent); }
  .read .kind.std { background: var(--color-ok-soft); color: var(--color-ok); }
  .read .kind.err { background: var(--color-err-soft); color: var(--color-err); }
  .read .kind.ref { background: var(--color-paper-3); color: var(--color-muted); }
  .read .label { flex: 1; min-width: 0; }
  .read .label small { display: block; color: var(--color-muted); font-size: var(--text-xs); }
  .read .arrow { color: var(--color-muted); }

  .keep { background: var(--color-paper-2); border-radius: var(--radius-card); padding: var(--space-2xs) var(--space-lg) var(--space-lg); margin-top: var(--space-xl); }
  .keep h2 { margin-top: var(--space-lg); }
  .next { margin-top: var(--space-xl); display: flex; justify-content: flex-end; align-items: center; gap: var(--space-sm); flex-wrap: wrap; }
  .next .spacer { flex: 1; }
  .btn { border: 0; background: var(--color-accent); color: var(--color-accent-ink); font: 500 var(--text-md) var(--font-body); min-height: 44px; padding: 0 var(--space-lg); border-radius: var(--radius-pill); cursor: pointer; display: inline-flex; align-items: center; transition: opacity var(--dur-micro) var(--ease-out); }
  .btn:hover { opacity: 0.9; }
  .btn:active { opacity: 0.8; }
  .btn.ghost { background: none; color: var(--color-muted); padding: 0; }
  .btn.ghost:hover { color: var(--color-ink); opacity: 1; }
  a.btn { text-decoration: none; }

  /* L'état des tests */
  .status { border-radius: var(--radius-card); padding: var(--space-md) var(--space-lg); margin-bottom: var(--space-md); }
  .status strong { display: block; font-weight: 600; }
  .status p { margin: var(--space-2xs) 0 0; }
  .status pre { margin: var(--space-sm) 0 0; padding: var(--space-sm); border-radius: var(--radius-control); background: var(--color-paper); color: var(--color-ink); overflow-x: auto; font-size: var(--text-xs); line-height: 1.5; white-space: pre; }
  .st-todo { background: var(--color-paper-2); color: var(--color-ink); }
  .st-in-progress { background: var(--color-warn-soft); color: var(--color-ink); } .st-in-progress strong { color: var(--color-warn); }
  .st-broken { background: var(--color-err-soft); color: var(--color-ink); } .st-broken strong { color: var(--color-err); }
  .st-green, .st-validated { background: var(--color-ok-soft); color: var(--color-ink); } .st-green strong, .st-validated strong { color: var(--color-ok); }
  .cmd { display: flex; align-items: center; gap: var(--space-xs); border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-card); padding: var(--space-xs) var(--space-xs) var(--space-xs) var(--space-md); font-size: var(--text-sm); margin-bottom: var(--space-xs); }
  .cmd code { background: none; flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; }
  .cmd button { border: var(--rule-hair) solid var(--color-rule-2); background: none; color: var(--color-ink); border-radius: var(--radius-pill); min-height: 32px; padding: 0 var(--space-sm); cursor: pointer; font: 500 var(--text-xs) var(--font-body); display: inline-flex; align-items: center; gap: var(--space-xs); transition: background-color var(--dur-micro) var(--ease-out); }
  .cmd button:hover { background: var(--color-paper-2); }
  .cmd button:active { background: var(--color-paper-3); }

  /* Les étapes à cocher */
  .task { border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-card); padding: var(--space-lg); margin-top: var(--space-xl); }
  .task h2 { margin-top: 0; }
  .task h3 { font-size: var(--text-sm); color: var(--color-muted); font-weight: 500; margin: var(--space-lg) 0 var(--space-xs); }
  ul.checks { list-style: none; padding: 0; margin: var(--space-xs) 0 0; }
  ul.checks li { margin: 0; max-width: none; }
  ul.checks label { display: flex; gap: var(--space-sm); align-items: flex-start; padding: var(--space-xs) var(--space-sm); margin: 0 calc(var(--space-sm) * -1); border-radius: var(--radius-control); cursor: pointer; transition: background-color var(--dur-micro) var(--ease-out); }
  ul.checks label:hover { background: var(--color-paper-2); }
  ul.checks input { flex: none; width: 18px; height: 18px; margin: var(--space-2xs) 0 0; accent-color: var(--color-accent); cursor: pointer; }
  ul.checks li.on span { color: var(--color-muted); }
  .steps-count { font: 400 var(--text-xs) var(--font-mono); color: var(--color-muted); margin-left: auto; }
  details { margin-top: var(--space-xl); }
  details summary { cursor: pointer; color: var(--color-muted); font-size: var(--text-sm); }
  .output { background: var(--color-paper-2); padding: var(--space-sm); border-radius: var(--radius-control); max-height: 320px; overflow: auto; white-space: pre; font: var(--text-xs)/1.5 var(--font-mono); margin-top: var(--space-xs); }

  /* La vue d'ensemble */
  .overview h1 { font: 400 var(--text-2xl)/1 var(--font-display); text-transform: lowercase; letter-spacing: -0.015em; margin: 0 0 var(--space-lg); }
  .roadmap { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-xs); margin-bottom: var(--space-lg); }
  .step { font-size: var(--text-sm); padding: var(--space-sm); border-radius: var(--radius-control); border: var(--rule-hair) solid var(--color-rule); color: var(--color-muted); min-width: 0; }
  .step b { font-weight: 500; font-variant-numeric: tabular-nums; margin-right: var(--space-2xs); }
  .step small { display: block; font-size: var(--text-xs); }
  .step.available { color: var(--color-ink); border-color: var(--color-rule-2); }
  .step.done { color: var(--color-ink); background: var(--color-ok-soft); border-color: transparent; }
  .card { border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-card); padding: var(--space-md); margin-bottom: var(--space-md); color: var(--color-ink); }
  .card-head { display: flex; align-items: baseline; gap: var(--space-sm); margin: 0 0 var(--space-sm); }
  .card h2 { margin: 0; font-size: var(--text-lg); font-weight: 600; display: flex; align-items: center; gap: var(--space-sm); }
  .card > h2 { margin-bottom: var(--space-sm); }
  .card-head .n { margin-left: auto; font: 400 var(--text-xs) var(--font-mono); color: var(--color-muted); }
  ul.ex { list-style: none; margin: 0; padding: 0; }
  ul.ex a { display: flex; align-items: center; gap: var(--space-sm); min-height: 44px; padding: 0 var(--space-sm); border-radius: var(--radius-control); color: inherit; text-decoration: none; transition: background-color var(--dur-micro) var(--ease-out); }
  ul.ex a:hover { background: var(--color-paper-2); }
  ul.ex a:active { background: var(--color-paper-3); }
  .ex-title .num { font-variant-numeric: tabular-nums; color: var(--color-muted); margin-right: var(--space-xs); }
  .ex-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill { font-size: var(--text-xs); padding: var(--space-3xs) var(--space-xs); border-radius: var(--radius-pill); white-space: nowrap; }
  .s-validated .pill, .s-green .pill { background: var(--color-ok-soft); color: var(--color-ok); }
  .s-in-progress .pill { background: var(--color-warn-soft); color: var(--color-warn); }
  .s-broken .pill { background: var(--color-err-soft); color: var(--color-err); }
  .s-todo .pill { background: var(--color-paper-3); color: var(--color-muted); }
  .side-list { margin: 0; padding-left: var(--space-lg); }
  @media (min-width: 700px) { .roadmap { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (max-width: 600px) { .focus h1, .overview h1 { font-size: 2.25rem; } .top .count { display: none; } .figure { padding: var(--space-xs); } .task { padding: var(--space-md); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; } }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">Chargement…</div></div>
<noscript><div class="wrap">Le dashboard a besoin de JavaScript pour afficher les fiches du parcours.</div></noscript>
<script>
const LABELS = { validated: "Validé", green: "Tests verts", "in-progress": "En cours", broken: "Ne compile pas", todo: "À faire" };
const RESOURCES = [
  ["book", "The Rust Programming Language", "Version Brown, avec quiz et modèle de permissions", "https://rust-book.cs.brown.edu/"],
  ["std", "Bibliothèque standard", "doc.rust-lang.org/std", "https://doc.rust-lang.org/std/"],
  ["ref", "Rust by Example", "Le même contenu, par l'exemple", "https://doc.rust-lang.org/rust-by-example/"],
  ["ref", "The Cargo Book", "Tout sur cargo et Cargo.toml", "https://doc.rust-lang.org/cargo/"],
  ["err", "Index des erreurs du compilateur", "Chaque code EXXXX expliqué", "https://doc.rust-lang.org/error_codes/"],
  ["ref", "Rust Playground", "Tester un bout de code dans le navigateur", "https://play.rust-lang.org/"],
];
// En version statique (GitHub Pages), pas de serveur : les fiches sont lues en lecture seule, sans tests ni progression.
const STATIC = window.LEARN_RUST_STATIC === true;
// Icônes : Lucide (ISC), https://lucide.dev
const ICONS = {
  book: '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
  std: '<path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/>',
  err: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  ref: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
  bulb: '<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/>',
  pin: '<path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/>',
  task: '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="m9 12 2 2 4-4"/>',
  copy: '<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
  review: '<path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/>',
  wrench: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
  layers: '<path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/>',
  out: '<path d="M7 7h10v10"/><path d="M7 17 17 7"/>',
};
const icon = (name) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`;
const HEADING_ICONS = { "À faire": "task", "Étapes": "task", "Avant de commencer": "task", "Fin de module": "task", "À lire dans le Rust Book": "book", "L'idée": "bulb", "À retenir": "pin" };
const heading = (h) => `<h2>${HEADING_ICONS[h] ? icon(HEADING_ICONS[h]) : ""}${inline(h)}</h2>`;
let state = null;
let rendered = "";
let tab = null; // "cours" | "pratique" pour l'exercice affiché
let tabFor = null;
const files = new Map();
// Les étapes cochées, par clé (voir stepKey dans content.mjs). En local, le serveur les écrit dans PROGRESS.checks.json ;
// sur le site, elles restent dans le navigateur.
let checks = {};
let checksVersion = 0;
const stepKeys = new Map();
const CHECKS_STORAGE = "learn-rust-checks";

function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}

// Rendu markdown minimal : titres, paragraphes, listes, tableaux, blocs de code, images SVG.
function markdown(md, base, file = "") {
  const lines = md.replace(/\r/g, "").split("\n");
  const out = [];
  for (let i = 0; i < lines.length; ) {
    const line = lines[i];
    const img = line.match(/^!\[([^\]]*)\]\(([^)]+)\)\s*$/);
    if (img) {
      out.push(`<div class="figure" data-svg="${esc(base + img[2])}" aria-label="${esc(img[1])}"></div>`); i++;
    } else if (line.startsWith("```")) {
      const code = [];
      for (i++; i < lines.length && !lines[i].startsWith("```"); i++) code.push(lines[i]);
      out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`); i++;
    } else if (/^#{1,6} /.test(line)) {
      const level = line.match(/^#+/)[0].length;
      out.push(`<h${level}>${inline(line.slice(level + 1))}</h${level}>`); i++;
    } else if (line.startsWith("|")) {
      const rows = [];
      for (; i < lines.length && lines[i].startsWith("|"); i++) rows.push(lines[i]);
      const cells = (r) => r.slice(1, r.endsWith("|") ? -1 : undefined).split("|").map((c) => c.trim());
      const body = rows.slice(2).map((r) => `<tr>${cells(r).map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`).join("");
      out.push(`<div class="table"><table><thead><tr>${cells(rows[0]).map((c) => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>`);
    } else if (/^\s*([-*]|\d+\.) /.test(line)) {
      const ordered = /^\s*\d+\. /.test(line);
      const items = [];
      for (; i < lines.length && /^\s*([-*]|\d+\.) /.test(lines[i]); i++) items.push(lines[i].replace(/^\s*([-*]|\d+\.) /, ""));
      const tag = ordered ? "ol" : "ul";
      if (!ordered && items.every((it) => /^\[[ x]\] /.test(it))) {
        out.push(`<ul class="checks">${items.map((it) => checkbox(file, it.slice(4))).join("")}</ul>`);
      } else {
        out.push(`<${tag}>${items.map((it) => `<li>${inline(it)}</li>`).join("")}</${tag}>`);
      }
    } else if (line.trim() === "") {
      i++;
    } else {
      const para = [];
      for (; i < lines.length && lines[i].trim() !== "" && !/^(#|```|\||!\[|\s*([-*]|\d+\.) )/.test(lines[i]); i++) para.push(lines[i]);
      out.push(`<p>${inline(para.join(" "))}</p>`);
    }
  }
  return out.join("\n");
}

function checkbox(file, text) {
  const key = stepKeys.get(`${file}\n${text}`);
  if (!key) return `<li>${inline(text)}</li>`;
  const on = Boolean(checks[key]);
  return `<li class="${on ? "on" : ""}"><label><input type="checkbox" data-key="${esc(key)}" data-text="${esc(text)}"${on ? " checked" : ""}><span>${inline(text)}</span></label></li>`;
}

// Découpe une fiche en { titre, sections } : chaque "## Titre" devient une entrée.
function sections(md) {
  const title = (md.match(/^# (.+)$/m)?.[1] ?? "").replace(/ · (cours|pratique)$/, "");
  const parts = md.replace(/^# .+$/m, "").split(/^(?=## )/m);
  const intro = parts.shift().trim();
  const map = new Map(parts.map((p) => [p.split("\n")[0].slice(3).trim(), p.split("\n").slice(1).join("\n").trim()]));
  return { title, intro, map };
}

// Les liens « À lire » deviennent des cartes : Rust Book, std, erreurs du compilateur.
function readCards(md) {
  const items = md.split("\n").filter((l) => l.startsWith("- [")).map((l) => {
    const m = l.match(/^- \[([^\]]+)\]\(([^)]+)\)\s*(.*)$/);
    if (!m) return "";
    const [, label, url, note] = m;
    const kind = label.startsWith("Rust Book") ? ["book", "Rust Book"] : label.startsWith("std") ? ["std", "Bibliothèque standard"] : label.startsWith("Erreur") ? ["err", "Erreur du compilateur"] : ["ref", "Référence"];
    const text = label.replace(/^(Rust Book|std|Erreur)\s*·?\s*/, "").replace(" · ", " ");
    const sub = note.replace(/^[:\s]+/, "").replace(/^\((.*)\)$/, "$1");
    return `<a class="read" href="${esc(url)}" target="_blank" rel="noopener"><span class="kind ${kind[0] === "book" ? "" : kind[0]}" title="${kind[1]}">${icon(kind[0])}</span><span class="label">${inline(text)}<small>${kind[1]}${sub ? `, ${inline(sub)}` : ""}</small></span><span class="arrow">${icon("out")}</span></a>`;
  });
  return `<div class="reads">${items.join("")}</div>`;
}

function visualStatus(ex) {
  if (ex.status === "in-progress" && !ex.tests.compiles) return "broken";
  return ex.status;
}
// « 01 - Move » devient « Move » : le numéro est déjà affiché à côté.
const shortTitle = (t) => t.replace(/^\d+\s*-\s*/, "");
const stepsDone = (steps) => steps.filter((st) => checks[st.key]).length;
const allChecked = (steps) => steps.length > 0 && stepsDone(steps) === steps.length;
// Un exercice est fini quand le tuteur l'a validé, ou quand toutes ses étapes sont cochées.
const isDone = (ex) => ex.status === "validated" || allChecked(ex.steps);
const startSteps = (m) => m.steps.filter((st) => st.group === "Avant de commencer");
const endSteps = (m) => m.steps.filter((st) => st.group === "Fin de module");
function moduleStatus(m) {
  const done = stepsDone(m.steps);
  return `s-${done === m.steps.length ? "validated" : done ? "in-progress" : "todo"}`;
}
const started = (m) => m && m.exercises.some((ex) => isDone(ex) || ex.status !== "todo" || stepsDone(ex.steps));
// Où reprendre : le début d'un module pas encore entamé, puis chaque exercice, puis la fin du module
// (sauf si le module suivant est déjà entamé). Renvoie { module } ou { ex }, vide quand tout est fait.
function nextTarget() {
  const all = exercises();
  for (const [i, m] of state.modules.entries()) {
    if (!started(m) && startSteps(m).length && !allChecked(startSteps(m))) return { module: m };
    const ex = all.find((e) => e.module.id === m.id && !isDone(e));
    if (ex) return { ex };
    if (endSteps(m).length && !allChecked(endSteps(m)) && !started(state.modules[i + 1])) return { module: m };
  }
  return {};
}
// Après une case cochée, la vue reste sur place même si l'étape suivante est ailleurs : le bouton « Continuer » y mène.
let hold = null;
function currentTarget() {
  const next = nextTarget();
  if (!hold) return next;
  const held = hold.module ? { module: state.modules.find((m) => m.id === hold.module) } : { ex: exercises().find((e) => e.pkg === hold.ex) };
  return held.module || held.ex ? held : next;
}
const targetId = (t) => (t.module ? `m:${t.module.id}` : t.ex ? `e:${t.ex.pkg}` : "");
function continueButton(current) {
  const next = nextTarget();
  if (!hold || targetId(next) === current) return "";
  const label = next.module ? `Module ${String(next.module.number).padStart(2, "0")}` : next.ex ? shortTitle(next.ex.title) : "La suite";
  return `<button class="btn" data-continue>Continuer : ${esc(label)} →</button>`;
}
function stepsHeading(title, steps) {
  return `<h2>${icon("task")}${esc(title)}${steps.length ? `<span class="steps-count">${stepsDone(steps)}/${steps.length}</span>` : ""}</h2>`;
}
// Les sous-parties « ### » d'une section, par titre.
function subsections(md = "") {
  return new Map(md.split(/^(?=### )/m).filter((part) => part.startsWith("### "))
    .map((part) => [part.split("\n")[0].slice(4).trim(), part.split("\n").slice(1).join("\n").trim()]));
}
const exercises = () => state.modules.flatMap((m) => m.exercises.map((ex) => ({ ...ex, module: m })));

// La première erreur du compilateur, sans le bruit de cargo autour.
function firstError(output) {
  const lines = output.split("\n");
  const start = lines.findIndex((l) => /^error(\[E\d+\])?:/.test(l));
  if (start < 0) return "";
  const end = lines.findIndex((l, i) => i > start && l.trim() === "");
  return lines.slice(start, end < 0 ? start + 15 : end).join("\n");
}

function statusBlock(ex) {
  const s = visualStatus(ex);
  const t = ex.tests;
  const [title, text] = {
    todo: ["Pas encore commencé", "Ouvre le fichier, prédis ce que va dire le compilateur, puis lance la commande."],
    "in-progress": [`${t.passed}/${t.total} tests passent`, "Bloqué ? <code>/hint</code> dans Claude Code."],
    broken: ["Ne compile pas", "Lis le message en entier. Besoin d'aide pour le décoder ? <code>/explain-error</code>."],
    green: ["Tous les tests passent", "Lance <code>/review</code> dans Claude Code pour valider l'exercice."],
    validated: ["Validé", "Rien à faire ici."],
  }[s];
  if (STATIC) return `<div class="status st-todo"><strong>Pour faire cet exercice</strong><p>Clone le repo, lance <code>claude</code> à la racine, puis <code>/next</code> : le tuteur te guide sans te donner la solution. Les tests sont rouges au départ, à toi de les faire passer.</p></div>`;
  const error = s === "broken" ? firstError(t.output) : "";
  return `<div class="status st-${s}"><strong>${title}</strong><p>${text}</p>${error ? `<pre>${esc(error)}</pre>` : ""}</div>`;
}

async function file(path) {
  if (!files.has(path)) files.set(path, await fetch(STATIC ? `../${path}` : `/api/file?path=${encodeURIComponent(path)}`).then((r) => (r.ok ? r.text() : "")).catch(() => ""));
  return files.get(path);
}

// Les diagrammes sont insérés dans la page (et pas en image) pour suivre le thème clair / sombre.
async function hydrateFigures() {
  for (const el of document.querySelectorAll(".figure[data-svg]")) {
    el.innerHTML = await file(el.dataset.svg);
    el.removeAttribute("data-svg");
  }
}

function topline(right) {
  const all = exercises();
  const done = all.filter(isDone).length;
  const count = STATIC ? `${all.length} exercices` : `${done}/${all.length} exercices validés`;
  const home = STATIC ? `<a class="link" href="../">Le projet</a>` : "";
  return `<div class="top"><a class="brand" href="#" aria-label="Learn Rust for web devs, l'exercice en cours"><span class="name">learn rust for web devs</span></a><span class="count">${count}</span><span class="spacer"></span>${home}${right}</div>
    <div class="bar"><div style="transform: scaleX(${all.length ? done / all.length : 0})"></div></div>`;
}

async function renderFocus(pinned) {
  const all = exercises();
  let ex = pinned && all.find((e) => e.pkg === pinned);
  if (!ex) {
    const target = currentTarget();
    if (target.module) return renderModule(target.module, false);
    ex = target.ex;
  }
  const app = document.getElementById("app");
  if (!ex) {
    app.innerHTML = topline(`<a class="link" href="#overview">Vue d'ensemble</a>`) +
      `<div class="focus"><h1>Tout est validé</h1><div class="status st-validated"><strong>Bravo.</strong><p>Lance <code>/quiz</code> dans Claude Code, puis l'étape Taskr du module.</p></div></div>`;
    return;
  }
  // Un exercice pas encore commencé s'ouvre sur le cours ; ensuite, sur la pratique.
  if (tabFor !== ex.pkg) { tabFor = ex.pkg; tab = ex.status === "todo" ? "cours" : "pratique"; }
  const [cours, pratique] = await Promise.all([file(ex.cours), file(ex.readme)]);
  const key = JSON.stringify([ex.pkg, tab, ex.status, ex.tests.passed, ex.tests.total, ex.tests.output.length, pinned, checksVersion, Boolean(hold)]);
  if (key === rendered) return;
  rendered = key;
  const base = ex.readme.replace(/README\.md$/, "");
  const position = ex.module.exercises.findIndex((e) => e.pkg === ex.pkg) + 1;
  const right = pinned ? `<a class="link" href="#">← Exercice en cours</a>` : `<a class="link" href="#overview">Vue d'ensemble</a>`;
  const c = sections(cours);
  const p = sections(pratique);
  const cmd = `cargo test -p ${ex.pkg}`;
  const groups = subsections(p.map.get("Étapes"));
  const coursSteps = ex.steps.filter((st) => st.group === "Cours");
  const pratiqueSteps = ex.steps.filter((st) => st.group === "Pratique");
  const tabCount = (steps) => (steps.length ? `<span class="c">${stepsDone(steps)}/${steps.length}</span>` : "");
  const next = pinned ? "" : continueButton(`e:${ex.pkg}`);

  let body;
  if (tab === "cours" && cours) {
    const reads = c.map.get("À lire dans le Rust Book");
    const keep = c.map.get("À retenir");
    const rest = [...c.map].filter(([h]) => h !== "À lire dans le Rust Book" && h !== "À retenir")
      .map(([h, md]) => (h === "L'idée" ? markdown(md, base) : `${heading(h)}${markdown(md, base)}`)).join("");
    body = `
      ${reads ? `${heading("À lire dans le Rust Book")}${readCards(reads)}` : ""}
      ${heading("L'idée")}${rest}
      ${keep ? `<div class="keep">${heading("À retenir")}${markdown(keep, base)}</div>` : ""}
      ${groups.has("Cours") ? `<div class="task">${stepsHeading("Avant la pratique", coursSteps)}${markdown(groups.get("Cours"), base, ex.readme)}</div>` : ""}
      <div class="next"><button class="btn" data-tab="pratique">Passer à la pratique →</button></div>`;
  } else {
    body = `
      ${statusBlock(ex)}
      <div class="cmd"><code>${esc(cmd)}</code><button id="copy">${icon("copy")}Copier</button></div>
      <div class="muted">Fichier : <code>${esc(base)}src/lib.rs</code></div>
      ${p.intro ? markdown(p.intro, base).replace(/<p>Relis la fiche[^<]*<code>COURS\.md<\/code>[^<]*<\/p>/, "") : ""}
      <div class="task">${[...p.map].map(([h, md]) => (h === "Étapes"
        ? `${stepsHeading("Étapes", pratiqueSteps)}${markdown(groups.get("Pratique") ?? md, base, ex.readme)}`
        : `${heading(h)}${markdown(md, base, ex.readme)}`)).join("")}</div>
      <div class="next"><button class="btn ghost" data-tab="cours">← Revoir le cours</button><span class="spacer"></span>${next}</div>
      ${STATIC ? "" : `<details><summary>Dernière sortie de cargo test</summary><div class="output">${esc(ex.tests.output.trim() || "(vide)")}</div></details>`}`;
  }

  app.innerHTML = topline(right) + `
    <div class="focus">
      <nav class="crumbs" aria-label="Où tu es"><a href="#module/${esc(ex.module.id)}">Module ${ex.module.number}, ${esc(ex.module.title.toLowerCase())}</a><span>exercice ${position} sur ${ex.module.exercises.length}</span></nav>
      <h1>${inline(shortTitle(c.title || p.title || ex.title))}</h1>
      <div class="tabs" role="tablist">
        <button class="${tab === "cours" ? "on" : ""}" data-tab="cours"><span class="n">1</span>Cours${tabCount(coursSteps)}</button>
        <button class="${tab === "pratique" ? "on" : ""}" data-tab="pratique"><span class="n">2</span>Pratique${tabCount(pratiqueSteps)}</button>
      </div>
      <div class="doc">${body}</div>
    </div>`;
  document.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => {
    tab = b.dataset.tab; rendered = ""; window.scrollTo(0, 0); render();
  }));
  document.getElementById("copy")?.addEventListener("click", (e) => {
    navigator.clipboard?.writeText(cmd).then(() => { e.currentTarget.innerHTML = `${icon("task")}Copié`; });
  });
  hydrateFigures();
}

// La page d'un module : son programme, les étapes avant de commencer et celles de fin de module.
async function renderModule(m, pinned) {
  const md = await file(m.readme);
  const key = JSON.stringify(["module", m.id, pinned, checksVersion, Boolean(hold), md.length]);
  if (key === rendered) return;
  rendered = key;
  const base = m.readme.replace(/README\.md$/, "");
  const r = sections(md);
  const step = state.roadmap.find((st) => st.number === m.number);
  const first = exercises().find((e) => e.module.id === m.id && !isDone(e));
  const right = pinned ? `<a class="link" href="#">← Exercice en cours</a>` : `<a class="link" href="#overview">Vue d'ensemble</a>`;
  const body = [...r.map].map(([h, part]) => {
    const steps = m.steps.filter((st) => st.group === h);
    return steps.length ? `<div class="task">${stepsHeading(h, steps)}${markdown(part, base, m.readme)}</div>` : `${heading(h)}${markdown(part, base, m.readme)}`;
  }).join("");
  const go = first ? `<a class="btn" href="#ex/${esc(first.pkg)}">${first.status === "todo" && !stepsDone(first.steps) ? "Commencer" : "Reprendre"} : ${esc(shortTitle(first.title))} →</a>` : "";
  document.getElementById("app").innerHTML = topline(right) + `
    <div class="focus">
      <nav class="crumbs" aria-label="Où tu es"><a href="#overview">Module ${m.number}</a><span>Rust Book, ${esc(step?.chapters ?? "")}</span></nav>
      <h1>${esc(m.title)}</h1>
      <div class="doc">${markdown(r.intro, base, m.readme)}${body}
        <div class="next"><span class="spacer"></span>${pinned ? go : continueButton(`m:${m.id}`) || go}</div>
      </div>
    </div>`;
  hydrateFigures();
}

function list(items, empty) {
  const real = items.filter((i) => !i.startsWith("_"));
  return real.length ? `<ul class="side-list">${real.map((i) => `<li>${inline(i)}</li>`).join("")}</ul>` : `<div class="muted">${empty}</div>`;
}

function renderOverview() {
  const key = JSON.stringify(["overview", state.modules, state.review, state.mistakes, state.taskr]);
  if (key === rendered) return;
  rendered = key;
  const roadmap = state.roadmap.map((step) => {
    const mod = state.modules.find((m) => m.number === step.number);
    const finished = mod && mod.exercises.length && mod.exercises.every(isDone);
    return `<div class="step ${finished ? "done" : step.available ? "available" : ""}"><b>${String(step.number).padStart(2, "0")}${finished ? " ✓" : ""}</b>${esc(step.title)}<small>${esc(step.chapters)}</small></div>`;
  }).join("");
  const modules = state.modules.map((m) => `
    <div class="card"><div class="card-head"><h2>${icon("layers")}${String(m.number).padStart(2, "0")} ${esc(m.title)}</h2><span class="n">${m.exercises.filter(isDone).length}/${m.exercises.length}</span></div>
      <ul class="ex"><li class="${moduleStatus(m)}"><a href="#module/${esc(m.id)}"><span class="ex-title">Avant de commencer et fin de module</span><span class="pill">${stepsDone(m.steps)}/${m.steps.length} étapes</span></a></li></ul>
      <ul class="ex">${m.exercises.map((ex) => {
        const s = ex.status !== "validated" && allChecked(ex.steps) ? "green" : visualStatus(ex);
        const done = stepsDone(ex.steps);
        const pill = s === "in-progress" ? `${ex.tests.passed}/${ex.tests.total} tests`
          : s === "todo" && done ? `${done}/${ex.steps.length} étapes`
          : ex.status !== "validated" && allChecked(ex.steps) ? "Étapes faites" : LABELS[s];
        return `<li class="s-${s}"><a href="#ex/${esc(ex.pkg)}"><span class="ex-title"><span class="num">${esc(ex.id.slice(0, 2))}</span>${esc(shortTitle(ex.title))}</span><span class="pill">${pill}</span></a></li>`;
      }).join("")}</ul></div>`).join("");
  const resources = `<div class="reads">${RESOURCES.map(([kind, label, sub, url]) =>
    `<a class="read" href="${url}" target="_blank" rel="noopener"><span class="kind ${kind === "book" ? "" : kind}">${icon(kind)}</span><span class="label">${esc(label)}<small>${esc(sub)}</small></span><span class="arrow">${icon("out")}</span></a>`).join("")}</div>`;
  document.getElementById("app").innerHTML = topline(`<a class="link" href="#">← Exercice en cours</a>`) + `
    <div class="overview">
      <h1>Vue d'ensemble</h1>
      <div class="roadmap">${roadmap}</div>
      ${modules}
      ${STATIC ? "" : `
      <div class="card"><h2>${icon("review")}À réviser</h2>${list(state.review, "Rien à réviser pour l'instant.")}</div>
      <div class="card"><h2>${icon("err")}Erreurs récurrentes</h2>${list(state.mistakes, "Rien de noté pour l'instant.")}</div>
      <div class="card"><h2>${icon("wrench")}Fil rouge Taskr</h2>${list(state.taskr, "Pas commencé.")}</div>`}
      <div class="card"><h2>${icon("book")}Documentation</h2>${resources}</div>
    </div>`;
}

function render() {
  if (!state) return;
  const hash = location.hash;
  if (hash === "#overview") renderOverview();
  else if (hash.startsWith("#module/")) {
    const m = state.modules.find((mod) => mod.id === decodeURIComponent(hash.slice(8)));
    if (m) renderModule(m, true); else renderFocus(null);
  }
  else renderFocus(hash.startsWith("#ex/") ? decodeURIComponent(hash.slice(4)) : null);
}

window.addEventListener("hashchange", () => { rendered = ""; tabFor = null; hold = null; window.scrollTo(0, 0); render(); });

document.getElementById("app").addEventListener("change", (e) => {
  const box = e.target.closest("input[data-key]");
  if (box) setCheck(box.dataset.key, box.dataset.text, box.checked);
});
document.getElementById("app").addEventListener("click", (e) => {
  if (!e.target.closest("[data-continue]")) return;
  hold = null; rendered = ""; tabFor = null; window.scrollTo(0, 0); render();
});

async function setCheck(key, text, done) {
  if (done) checks[key] = { text, at: new Date().toISOString() };
  else delete checks[key];
  checksVersion++;
  // La vue reste sur ce qu'on est en train de faire, même si cette case termine l'étape.
  if (!location.hash.startsWith("#ex/") && !location.hash.startsWith("#module/")) {
    const t = currentTarget();
    hold = t.module ? { module: t.module.id } : t.ex ? { ex: t.ex.pkg } : null;
  }
  rendered = ""; render();
  if (STATIC) {
    try { localStorage.setItem(CHECKS_STORAGE, JSON.stringify(checks)); } catch {}
    return;
  }
  const saved = await fetch("/api/checks", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ key, text, done }) })
    .then((r) => (r.ok ? r.json() : null)).catch(() => null);
  if (saved) checks = saved;
}

async function loadChecks() {
  if (STATIC) {
    try { return JSON.parse(localStorage.getItem(CHECKS_STORAGE) ?? "{}"); } catch { return {}; }
  }
  return fetch("/api/checks").then((r) => r.json()).catch(() => checks);
}

async function refresh() {
  try {
    const [next, saved] = await Promise.all([fetch(STATIC ? "state.json" : "/api/state").then((r) => r.json()), loadChecks()]);
    state = next;
    if (JSON.stringify(saved) !== JSON.stringify(checks)) { checks = saved; checksVersion++; }
    for (const m of state.modules) {
      for (const st of m.steps) stepKeys.set(`${m.readme}\n${st.text}`, st.key);
      for (const ex of m.exercises) for (const st of ex.steps) stepKeys.set(`${ex.readme}\n${st.text}`, st.key);
    }
    render();
  } catch {
    document.getElementById("app").innerHTML = `<div class="loading">Serveur injoignable.</div>`;
    rendered = "";
  }
  if (!STATIC) setTimeout(refresh, 3000);
}
refresh();
</script>
</body>
</html>
