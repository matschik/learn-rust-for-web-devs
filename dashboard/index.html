<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>learn-rust</title>
<style>
  :root {
    --bg: #faf8f5; --panel: #ffffff; --text: #1f1d1a; --muted: #6b665e; --line: #e7e2da;
    --accent: #c2410c; --accent-soft: #fdebdd;
    --ok: #15803d; --ok-soft: #dcfce7; --warn: #a16207; --warn-soft: #fef3c7;
    --err: #b91c1c; --err-soft: #fee2e2; --todo-soft: #f1efeb;
    --code: #f4f1ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151412; --panel: #1d1b19; --text: #ece8e2; --muted: #9c968c; --line: #2f2c28;
      --accent: #f97316; --accent-soft: #3a2314;
      --ok: #4ade80; --ok-soft: #14301f; --warn: #facc15; --warn-soft: #352c0e;
      --err: #f87171; --err-soft: #3a1818; --todo-soft: #262421;
      --code: #24221f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 20px 24px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 20px; letter-spacing: -0.01em; }
  h1 span { color: var(--accent); }
  .muted { color: var(--muted); font-size: 13px; }
  .bar { height: 8px; border-radius: 99px; background: var(--todo-soft); overflow: hidden; margin-top: 12px; }
  .bar > div { height: 100%; background: var(--accent); transition: width .4s; }
  .roadmap { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; margin-top: 14px; }
  .step { font-size: 12px; padding: 6px 8px; border-radius: 8px; background: var(--todo-soft); color: var(--muted); min-width: 0; }
  .step b { display: block; font-size: 11px; }
  .step span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .step.available { background: var(--accent-soft); color: var(--text); }
  .step.done { background: var(--ok-soft); color: var(--text); }
  main > * { min-width: 0; }
  main { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 20px; padding: 20px 24px; max-width: 1400px; margin: 0 auto; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .card > h2 { margin: 0 0 10px; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .module-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .module-head strong { font-size: 15px; }
  ul.ex { list-style: none; margin: 0; padding: 0; }
  ul.ex li button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 0; border-radius: 8px; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  ul.ex li button:hover { background: var(--todo-soft); }
  ul.ex li button.selected { background: var(--accent-soft); }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--line); }
  .ex-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
  .s-validated .dot { background: var(--ok); } .s-validated .pill { background: var(--ok-soft); color: var(--ok); }
  .s-green .dot { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); } .s-green .pill { background: var(--ok-soft); color: var(--ok); }
  .s-in-progress .dot { background: var(--warn); } .s-in-progress .pill { background: var(--warn-soft); color: var(--warn); }
  .s-broken .dot { background: var(--err); } .s-broken .pill { background: var(--err-soft); color: var(--err); }
  .s-todo .dot { background: none; border: 2px solid var(--muted); }
  .s-todo .pill { background: var(--todo-soft); color: var(--muted); }
  .side-list { margin: 0; padding-left: 18px; }
  .side-list li { margin: 4px 0; }
  .detail-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .cmd { display: flex; align-items: center; gap: 8px; background: var(--code); border-radius: 8px; padding: 8px 10px; font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .cmd code { flex: 1; overflow-x: auto; white-space: nowrap; }
  .cmd button { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 6px; padding: 2px 8px; cursor: pointer; font: 12px system-ui; }
  .readme { overflow-wrap: anywhere; }
  .readme h1 { font-size: 22px; margin: 4px 0 12px; }
  .readme h2 { font-size: 17px; margin: 20px 0 8px; }
  .readme pre, .output { background: var(--code); padding: 12px; border-radius: 8px; overflow-x: auto; font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .readme code { background: var(--code); padding: 1px 5px; border-radius: 4px; font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .readme pre code { background: none; padding: 0; }
  .readme table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; }
  .readme th, .readme td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
  .readme a { color: var(--accent); }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; margin-top: 12px; }
  .output { max-height: 320px; overflow: auto; white-space: pre; margin-top: 8px; }
  .loading { padding: 40px; text-align: center; color: var(--muted); }
  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; padding: 16px; }
    header { padding: 16px; }
    .roadmap { grid-template-columns: repeat(4, 1fr); }
  }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1><span>learn-rust</span> · progression</h1>
    <div class="muted" id="summary">Chargement…</div>
  </div>
  <div class="bar"><div id="bar" style="width:0"></div></div>
  <div class="roadmap" id="roadmap"></div>
</header>
<main>
  <aside>
    <div id="modules"><div class="loading">Je lance les tests…</div></div>
    <div class="card"><h2>À réviser</h2><div id="review"></div></div>
    <div class="card"><h2>Erreurs récurrentes</h2><div id="mistakes"></div></div>
    <div class="card"><h2>Fil rouge Taskr</h2><div id="taskr"></div></div>
  </aside>
  <section class="card" id="detail"><div class="loading">Choisis un exercice.</div></section>
</main>
<script>
const LABELS = { validated: "Validé", green: "Tests verts · /review", "in-progress": "En cours", broken: "Ne compile pas", todo: "À faire" };
let state = null;
let selected = load("selected");
let renderedDetail = "";

function load(key) { try { return localStorage.getItem(key); } catch { return null; } }
function save(key, value) { try { localStorage.setItem(key, value); } catch {} }
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}

// Rendu markdown minimal (titres, paragraphes, listes, tableaux, blocs de code) : pas de dépendance réseau.
function markdown(md) {
  const lines = md.replace(/\r/g, "").split("\n");
  const out = [];
  for (let i = 0; i < lines.length; ) {
    const line = lines[i];
    if (line.startsWith("```")) {
      const code = [];
      for (i++; i < lines.length && !lines[i].startsWith("```"); i++) code.push(lines[i]);
      out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`); i++;
    } else if (/^#{1,6} /.test(line)) {
      const level = line.match(/^#+/)[0].length;
      out.push(`<h${level}>${inline(line.slice(level + 1))}</h${level}>`); i++;
    } else if (line.startsWith("|")) {
      const rows = [];
      for (; i < lines.length && lines[i].startsWith("|"); i++) rows.push(lines[i]);
      const cells = (r) => r.slice(1, r.endsWith("|") ? -1 : undefined).split("|").map((c) => c.trim());
      const body = rows.slice(2).map((r) => `<tr>${cells(r).map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`).join("");
      out.push(`<table><thead><tr>${cells(rows[0]).map((c) => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table>`);
    } else if (/^\s*([-*]|\d+\.) /.test(line)) {
      const ordered = /^\s*\d+\. /.test(line);
      const items = [];
      for (; i < lines.length && /^\s*([-*]|\d+\.) /.test(lines[i]); i++) items.push(lines[i].replace(/^\s*([-*]|\d+\.) /, ""));
      const tag = ordered ? "ol" : "ul";
      out.push(`<${tag}>${items.map((it) => `<li>${inline(it)}</li>`).join("")}</${tag}>`);
    } else if (line.trim() === "") {
      i++;
    } else {
      const para = [];
      for (; i < lines.length && lines[i].trim() !== "" && !/^(#|```|\||\s*([-*]|\d+\.) )/.test(lines[i]); i++) para.push(lines[i]);
      out.push(`<p>${inline(para.join(" "))}</p>`);
    }
  }
  return out.join("\n");
}

function visualStatus(ex) {
  if (ex.status === "in-progress" && !ex.tests.compiles) return "broken";
  return ex.status;
}
function pillText(ex) {
  const s = visualStatus(ex);
  if (s === "in-progress") return `${ex.tests.passed}/${ex.tests.total} tests`;
  return LABELS[s];
}
const isDone = (ex) => ex.status === "validated";

function list(items, empty) {
  return items.length ? `<ul class="side-list">${items.map((i) => `<li>${inline(i)}</li>`).join("")}</ul>` : `<div class="muted">${empty}</div>`;
}

function render() {
  const all = state.modules.flatMap((m) => m.exercises);
  const done = all.filter(isDone).length;
  const green = all.filter((e) => e.status === "green").length;
  const modulesDone = state.modules.filter((m) => m.exercises.length && m.exercises.every(isDone)).length;
  document.getElementById("summary").textContent =
    `${done}/${all.length} exercices validés` + (green ? ` · ${green} à faire relire` : "") + ` · module ${modulesDone + 1 > 8 ? 8 : modulesDone + 1}/8`;
  document.getElementById("bar").style.width = `${all.length ? (done / all.length) * 100 : 0}%`;

  document.getElementById("roadmap").innerHTML = state.roadmap.map((step) => {
    const mod = state.modules.find((m) => m.number === step.number);
    const finished = mod && mod.exercises.length && mod.exercises.every(isDone);
    const cls = finished ? "done" : step.available ? "available" : "";
    return `<div class="step ${cls}" title="${esc(step.title)}"><b>${String(step.number).padStart(2, "0")}${finished ? " ✓" : ""}</b><span>${esc(step.title)}</span></div>`;
  }).join("");

  if (!selected || !all.some((e) => e.pkg === selected)) {
    selected = (all.find((e) => !isDone(e)) ?? all[0])?.pkg ?? null;
  }

  document.getElementById("modules").innerHTML = state.modules.map((m) => {
    const d = m.exercises.filter(isDone).length;
    return `<div class="card">
      <div class="module-head"><strong>${String(m.number).padStart(2, "0")} · ${esc(m.title)}</strong><span class="muted">${d}/${m.exercises.length}</span></div>
      <ul class="ex">${m.exercises.map((ex) => `
        <li class="s-${visualStatus(ex)}"><button data-pkg="${esc(ex.pkg)}" class="${ex.pkg === selected ? "selected" : ""}">
          <span class="dot"></span><span class="ex-title">${esc(ex.title)}</span><span class="pill">${pillText(ex)}</span>
        </button></li>`).join("")}
      </ul></div>`;
  }).join("") + `<p class="muted">Pour l'instant seul le module 01 existe : le tuteur génère les suivants au fur et à mesure.</p>`;

  document.querySelectorAll("button[data-pkg]").forEach((b) => b.addEventListener("click", () => {
    selected = b.dataset.pkg; save("selected", selected); render();
  }));

  document.getElementById("review").innerHTML = list(state.review.filter((r) => !r.startsWith("_")), "Rien à réviser pour l'instant.");
  document.getElementById("mistakes").innerHTML = list(state.mistakes, "Rien de noté pour l'instant.");
  document.getElementById("taskr").innerHTML = list(state.taskr, "Pas commencé.");

  renderDetail(all.find((e) => e.pkg === selected));
}

async function renderDetail(ex) {
  const el = document.getElementById("detail");
  if (!ex) { el.innerHTML = `<div class="loading">Aucun exercice.</div>`; return; }
  const key = JSON.stringify([ex.pkg, ex.status, ex.tests.passed, ex.tests.total, ex.tests.output.length]);
  if (key === renderedDetail) return;
  renderedDetail = key;
  const md = await fetch(`/api/file?path=${encodeURIComponent(ex.readme)}`).then((r) => r.text()).catch(() => "");
  const html = markdown(md);
  const cmd = `cargo test -p ${ex.pkg}`;
  const s = visualStatus(ex);
  const hint = {
    todo: "Pas encore commencé. Dans Claude Code : <code>/next</code>.",
    "in-progress": "Bloqué ? <code>/hint</code> pour un indice.",
    broken: "Le compilateur râle : <code>/explain-error</code> t'aide à lire le message.",
    green: "Tous les tests passent. Lance <code>/review</code> pour valider l'exercice.",
    validated: `Validé${ex.validated?.date ? ` le ${esc(ex.validated.date)}` : ""} avec ${ex.validated?.hints ?? 0} indice(s).`,
  }[s];
  el.innerHTML = `
    <div class="detail-head s-${s}"><span class="pill">${pillText(ex)}</span><span class="muted">${esc(ex.readme)}</span></div>
    <div class="cmd"><code>${esc(cmd)}</code><button id="copy">Copier</button></div>
    <p class="muted">${hint}</p>
    <div class="readme">${html}</div>
    <details><summary>Dernière sortie de <code>cargo test</code></summary><div class="output">${esc(ex.tests.output.trim() || "(vide)")}</div></details>`;
  document.getElementById("copy").addEventListener("click", (e) => {
    navigator.clipboard?.writeText(cmd).then(() => { e.target.textContent = "Copié"; });
  });
}

async function refresh() {
  try {
    state = await fetch("/api/state").then((r) => r.json());
    render();
  } catch {
    document.getElementById("summary").textContent = "Serveur injoignable : lance node dashboard/server.mjs";
  }
  setTimeout(refresh, 3000);
}
refresh();
</script>
</body>
</html>
