<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>learn-rust</title>
<style>
  :root {
    --bg: #faf8f5; --panel: #ffffff; --text: #1f1d1a; --muted: #6b665e; --line: #e7e2da;
    --accent: #c2410c; --accent-soft: #fdebdd;
    --ok: #15803d; --ok-soft: #dcfce7; --warn: #a16207; --warn-soft: #fef3c7;
    --err: #b91c1c; --err-soft: #fee2e2; --todo-soft: #f1efeb;
    --code: #f4f1ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151412; --panel: #1d1b19; --text: #ece8e2; --muted: #9c968c; --line: #2f2c28;
      --accent: #f97316; --accent-soft: #3a2314;
      --ok: #4ade80; --ok-soft: #14301f; --warn: #facc15; --warn-soft: #352c0e;
      --err: #f87171; --err-soft: #3a1818; --todo-soft: #262421;
      --code: #24221f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: var(--accent); }
  code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .muted { color: var(--muted); font-size: 13px; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  .loading { padding: 80px 0; text-align: center; color: var(--muted); }

  /* Barre du haut : discrète, une ligne */
  .topline { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); }
  .topline a { color: var(--muted); text-decoration: none; border-bottom: 1px dotted var(--muted); }
  .bar { height: 3px; border-radius: 99px; background: var(--todo-soft); overflow: hidden; margin: 8px 0 40px; }
  .bar > div { height: 100%; background: var(--accent); transition: width .4s; }

  /* Vue focus */
  .focus h1 { font-size: 32px; line-height: 1.2; margin: 0 0 20px; letter-spacing: -0.02em; }
  .status { border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
  .status strong { display: block; font-size: 18px; }
  .status p { margin: 4px 0 0; }
  .status pre { margin: 12px 0 0; padding: 12px; border-radius: 8px; background: var(--panel); overflow-x: auto; font-size: 13px; line-height: 1.45; white-space: pre; }
  .st-todo { background: var(--todo-soft); }
  .st-in-progress { background: var(--warn-soft); } .st-in-progress strong { color: var(--warn); }
  .st-broken { background: var(--err-soft); } .st-broken strong { color: var(--err); }
  .st-green, .st-validated { background: var(--ok-soft); } .st-green strong, .st-validated strong { color: var(--ok); }
  .cmd { display: flex; align-items: center; gap: 8px; background: var(--code); border-radius: 8px; padding: 10px 12px; font-size: 14px; margin-bottom: 6px; }
  .cmd code { flex: 1; overflow-x: auto; white-space: nowrap; }
  .cmd button { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 6px; padding: 2px 10px; cursor: pointer; font: 12px system-ui; }
  .file { margin-bottom: 32px; }
  .readme { overflow-wrap: anywhere; }
  .readme h2 { font-size: 20px; margin: 32px 0 8px; }
  .readme h3 { font-size: 17px; margin: 24px 0 8px; }
  .readme pre { background: var(--code); padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 14px; line-height: 1.45; }
  .readme code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: 14px; }
  .readme pre code { background: none; padding: 0; }
  .readme table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; font-size: 14px; }
  .readme th, .readme td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
  .task { border-left: 3px solid var(--accent); padding-left: 16px; }
  .task h2 { margin-top: 0; }
  details { margin-top: 32px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .output { background: var(--code); padding: 12px; border-radius: 8px; max-height: 320px; overflow: auto; white-space: pre; font-size: 13px; line-height: 1.45; margin-top: 8px; }

  /* Vue d'ensemble */
  .overview h1 { font-size: 24px; margin: 0 0 20px; }
  .roadmap { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 24px; }
  .step { font-size: 12px; padding: 6px 8px; border-radius: 8px; background: var(--todo-soft); color: var(--muted); min-width: 0; }
  .step b { display: block; font-size: 11px; }
  .step span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .step.available { background: var(--accent-soft); color: var(--text); }
  .step.done { background: var(--ok-soft); color: var(--text); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .card > h2 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  ul.ex { list-style: none; margin: 0; padding: 0; }
  ul.ex a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: inherit; text-decoration: none; }
  ul.ex a:hover { background: var(--todo-soft); }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .ex-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
  .s-validated .dot, .s-green .dot { background: var(--ok); } .s-validated .pill, .s-green .pill { background: var(--ok-soft); color: var(--ok); }
  .s-in-progress .dot { background: var(--warn); } .s-in-progress .pill { background: var(--warn-soft); color: var(--warn); }
  .s-broken .dot { background: var(--err); } .s-broken .pill { background: var(--err-soft); color: var(--err); }
  .s-todo .dot { border: 2px solid var(--muted); } .s-todo .pill { background: var(--todo-soft); color: var(--muted); }
  .side-list { margin: 0; padding-left: 18px; }
  @media (min-width: 700px) { .roadmap { grid-template-columns: repeat(8, 1fr); } }
  @media (max-width: 600px) { .focus h1 { font-size: 26px; } .bar { margin-bottom: 28px; } }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">Je lance les tests…</div></div>
<script>
const LABELS = { validated: "Validé", green: "Tests verts", "in-progress": "En cours", broken: "Ne compile pas", todo: "À faire" };
let state = null;
let rendered = "";
const readmes = new Map();

function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}

// Rendu markdown minimal (titres, paragraphes, listes, tableaux, blocs de code) : pas de dépendance réseau.
function markdown(md) {
  const lines = md.replace(/\r/g, "").split("\n");
  const out = [];
  for (let i = 0; i < lines.length; ) {
    const line = lines[i];
    if (line.startsWith("```")) {
      const code = [];
      for (i++; i < lines.length && !lines[i].startsWith("```"); i++) code.push(lines[i]);
      out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`); i++;
    } else if (/^#{1,6} /.test(line)) {
      const level = line.match(/^#+/)[0].length;
      out.push(`<h${level}>${inline(line.slice(level + 1))}</h${level}>`); i++;
    } else if (line.startsWith("|")) {
      const rows = [];
      for (; i < lines.length && lines[i].startsWith("|"); i++) rows.push(lines[i]);
      const cells = (r) => r.slice(1, r.endsWith("|") ? -1 : undefined).split("|").map((c) => c.trim());
      const body = rows.slice(2).map((r) => `<tr>${cells(r).map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`).join("");
      out.push(`<table><thead><tr>${cells(rows[0]).map((c) => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table>`);
    } else if (/^\s*([-*]|\d+\.) /.test(line)) {
      const ordered = /^\s*\d+\. /.test(line);
      const items = [];
      for (; i < lines.length && /^\s*([-*]|\d+\.) /.test(lines[i]); i++) items.push(lines[i].replace(/^\s*([-*]|\d+\.) /, ""));
      const tag = ordered ? "ol" : "ul";
      out.push(`<${tag}>${items.map((it) => `<li>${inline(it)}</li>`).join("")}</${tag}>`);
    } else if (line.trim() === "") {
      i++;
    } else {
      const para = [];
      for (; i < lines.length && lines[i].trim() !== "" && !/^(#|```|\||\s*([-*]|\d+\.) )/.test(lines[i]); i++) para.push(lines[i]);
      out.push(`<p>${inline(para.join(" "))}</p>`);
    }
  }
  return out.join("\n");
}

// Sépare l'énoncé : le titre, la section « À faire » (montrée en premier), et le reste (le concept).
function splitReadme(md) {
  const title = md.match(/^# (.+)$/m)?.[1] ?? "";
  const body = md.replace(/^# .+$/m, "");
  const parts = body.split(/^(?=## )/m);
  const taskIndex = parts.findIndex((p) => /^## À faire/.test(p));
  const task = taskIndex >= 0 ? parts.splice(taskIndex, 1)[0] : "";
  return { title, task, concept: parts.join("").trim() };
}

function visualStatus(ex) {
  if (ex.status === "in-progress" && !ex.tests.compiles) return "broken";
  return ex.status;
}
const isDone = (ex) => ex.status === "validated";
const exercises = () => state.modules.flatMap((m) => m.exercises.map((ex) => ({ ...ex, module: m })));

// La première erreur du compilateur, sans le bruit de cargo autour.
function firstError(output) {
  const lines = output.split("\n");
  const start = lines.findIndex((l) => /^error(\[E\d+\])?:/.test(l));
  if (start < 0) return "";
  const end = lines.findIndex((l, i) => i > start && l.trim() === "");
  return lines.slice(start, end < 0 ? start + 15 : end).join("\n");
}

function statusBlock(ex) {
  const s = visualStatus(ex);
  const t = ex.tests;
  const blocks = {
    todo: ["Pas encore commencé", "Ouvre le fichier, prédis ce que va dire le compilateur, puis lance la commande."],
    "in-progress": [`${t.passed}/${t.total} tests passent`, "Bloqué ? <code>/hint</code> dans Claude Code."],
    broken: ["Ne compile pas", "Lis le message en entier. Besoin d'aide pour le décoder ? <code>/explain-error</code>."],
    green: ["Tous les tests passent", "Lance <code>/review</code> dans Claude Code pour valider l'exercice."],
    validated: ["Validé", "Rien à faire ici."],
  }[s];
  const error = s === "broken" ? firstError(t.output) : "";
  return `<div class="status st-${s}"><strong>${blocks[0]}</strong><p>${blocks[1]}</p>${error ? `<pre>${esc(error)}</pre>` : ""}</div>`;
}

async function readme(path) {
  if (!readmes.has(path)) {
    readmes.set(path, await fetch(`/api/file?path=${encodeURIComponent(path)}`).then((r) => r.text()).catch(() => ""));
  }
  return readmes.get(path);
}

function topline(right) {
  const all = exercises();
  const done = all.filter(isDone).length;
  return `<div class="topline"><span>${done}/${all.length} exercices validés</span>${right}</div>
    <div class="bar"><div style="width:${all.length ? (done / all.length) * 100 : 0}%"></div></div>`;
}

async function renderFocus(pinned) {
  const all = exercises();
  const ex = (pinned && all.find((e) => e.pkg === pinned)) ?? all.find((e) => !isDone(e));
  const app = document.getElementById("app");
  if (!ex) {
    app.innerHTML = topline(`<a href="#overview">Vue d'ensemble</a>`) +
      `<div class="focus"><h1>Module terminé</h1><div class="status st-validated"><strong>Bravo.</strong><p>Lance <code>/quiz</code> dans Claude Code, puis l'étape Taskr du module.</p></div></div>`;
    return;
  }
  const md = await readme(ex.readme);
  const key = JSON.stringify([ex.pkg, ex.status, ex.tests.passed, ex.tests.total, ex.tests.output.length, pinned, all.filter(isDone).length]);
  if (key === rendered) return;
  rendered = key;
  const { title, task, concept } = splitReadme(md);
  const position = `${ex.module.exercises.indexOf(ex.module.exercises.find((e) => e.pkg === ex.pkg)) + 1}/${ex.module.exercises.length}`;
  const cmd = `cargo test -p ${ex.pkg}`;
  const right = pinned ? `<a href="#">Revenir à l'exercice en cours</a>` : `<a href="#overview">Vue d'ensemble</a>`;
  app.innerHTML = topline(right) + `
    <div class="focus">
      <div class="muted">Module ${String(ex.module.number).padStart(2, "0")} · exercice ${position}</div>
      <h1>${inline(title || ex.title)}</h1>
      ${statusBlock(ex)}
      <div class="cmd"><code>${esc(cmd)}</code><button id="copy">Copier</button></div>
      <div class="muted file">Fichier : <code>${esc(ex.readme.replace(/README\.md$/, "src/lib.rs"))}</code></div>
      <div class="readme">
        ${task ? `<div class="task">${markdown(task)}</div>` : ""}
        ${concept ? markdown(concept) : ""}
      </div>
      <details><summary>Dernière sortie de cargo test</summary><div class="output">${esc(ex.tests.output.trim() || "(vide)")}</div></details>
    </div>`;
  document.getElementById("copy").addEventListener("click", (e) => {
    navigator.clipboard?.writeText(cmd).then(() => { e.target.textContent = "Copié"; });
  });
}

function list(items, empty) {
  const real = items.filter((i) => !i.startsWith("_"));
  return real.length ? `<ul class="side-list">${real.map((i) => `<li>${inline(i)}</li>`).join("")}</ul>` : `<div class="muted">${empty}</div>`;
}

function renderOverview() {
  const key = JSON.stringify(["overview", state.modules, state.review, state.mistakes, state.taskr]);
  if (key === rendered) return;
  rendered = key;
  const roadmap = state.roadmap.map((step) => {
    const mod = state.modules.find((m) => m.number === step.number);
    const finished = mod && mod.exercises.length && mod.exercises.every(isDone);
    return `<div class="step ${finished ? "done" : step.available ? "available" : ""}" title="${esc(step.title)}"><b>${String(step.number).padStart(2, "0")}${finished ? " ✓" : ""}</b><span>${esc(step.title)}</span></div>`;
  }).join("");
  const modules = state.modules.map((m) => `
    <div class="card"><h2>${String(m.number).padStart(2, "0")} · ${esc(m.title)} · ${m.exercises.filter(isDone).length}/${m.exercises.length}</h2>
      <ul class="ex">${m.exercises.map((ex) => {
        const s = visualStatus(ex);
        const pill = s === "in-progress" ? `${ex.tests.passed}/${ex.tests.total} tests` : LABELS[s];
        return `<li class="s-${s}"><a href="#ex/${esc(ex.pkg)}"><span class="dot"></span><span class="ex-title">${esc(ex.title)}</span><span class="pill">${pill}</span></a></li>`;
      }).join("")}</ul></div>`).join("");
  document.getElementById("app").innerHTML = topline(`<a href="#">Revenir à l'exercice en cours</a>`) + `
    <div class="overview">
      <h1>Vue d'ensemble</h1>
      <div class="roadmap">${roadmap}</div>
      ${modules}
      <div class="card"><h2>À réviser</h2>${list(state.review, "Rien à réviser pour l'instant.")}</div>
      <div class="card"><h2>Erreurs récurrentes</h2>${list(state.mistakes, "Rien de noté pour l'instant.")}</div>
      <div class="card"><h2>Fil rouge Taskr</h2>${list(state.taskr, "Pas commencé.")}</div>
    </div>`;
}

function render() {
  if (!state) return;
  const hash = location.hash;
  if (hash === "#overview") renderOverview();
  else renderFocus(hash.startsWith("#ex/") ? decodeURIComponent(hash.slice(4)) : null);
}

window.addEventListener("hashchange", () => { rendered = ""; window.scrollTo(0, 0); render(); });

async function refresh() {
  try {
    state = await fetch("/api/state").then((r) => r.json());
    render();
  } catch {
    document.getElementById("app").innerHTML = `<div class="loading">Serveur injoignable.</div>`;
    rendered = "";
  }
  setTimeout(refresh, 3000);
}
refresh();
</script>
</body>
</html>
